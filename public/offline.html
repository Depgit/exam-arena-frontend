<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <title>Mind Race — You're offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #05060d;
        color: #e9e7ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0 auto 24px; max-width: 320px; color: #a9a6c8; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(90deg, #7c5cff, #c04bff);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Mind Race" />
      <h1>You're offline</h1>
      <p>Mind Race needs an internet connection for live battles. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
