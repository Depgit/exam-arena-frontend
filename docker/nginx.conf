server {
    # Listen on both stacks: inside the container "localhost" resolves to ::1
    # first, so an IPv4-only listener makes the health check fail.
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Vite emits content-hashed asset names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: React Router owns the path, so every unknown route
    # must serve index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

